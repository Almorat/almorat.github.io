<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almorat - Personal Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .projects {
            text-align: left;
            margin-top: 40px;
        }

        .projects h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            text-align: center;
        }

        .project-list {
            list-style: none;
        }

        .project-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .project-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .project-name {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .project-description {
            color: #666;
            margin-bottom: 10px;
        }

        .project-links {
            display: flex;
            gap: 15px;
        }

        .project-link {
            color: #764ba2;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.2s;
        }

        .project-link:hover {
            color: #667eea;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .profile-image {
                width: 120px;
                height: 120px;
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-image">A</div>
        <h1>Welcome, i'm Almorat</h1>
        <p class="subtitle">Software Developer</p>

        <div class="projects">
            <h2>My Projects</h2>
            <ul class="project-list">
                <li class="project-item">
                    <div class="project-name">🎲 Dice Roller</div>
                    <div class="project-description">A simple and fun dice rolling application</div>
                    <div class="project-links">
                        <a href="dice-roller/privacy.html" class="project-link">Privacy Policy</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
